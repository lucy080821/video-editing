*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#000;font-family:'BV',sans-serif;color:var(--ink)}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.paper{background:radial-gradient(circle at 50% 42%,#FAF4E4 0%,#F2E8CF 62%,#E3D5B2 100%)}
.paper::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(20,37,74,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(20,37,74,.045) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}
.night{background:radial-gradient(circle at 50% 40%,#18284a 0%,#0d1626 70%,#070c16 100%);color:#f4efe2}
.gridbg{position:absolute;inset:-100px;background-image:linear-gradient(rgba(130,170,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(130,170,255,.08) 1px,transparent 1px);background-size:80px 80px}
#noise{position:absolute;inset:0;z-index:40;pointer-events:none;opacity:.16;mix-blend-mode:multiply}
#logo{position:absolute;left:34px;top:26px;width:92px;height:92px;z-index:60;border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#src{position:absolute;right:36px;top:30px;z-index:60;max-width:760px;font:600 23px 'BV';background:#fffdf5;color:#333;padding:9px 16px 9px 14px;border-left:6px solid var(--yel);box-shadow:0 4px 14px rgba(0,0,0,.25);transform-origin:100% 0}
#src b{font-weight:800;color:var(--navy);letter-spacing:.06em;font-size:19px;margin-right:8px}
#sub{position:absolute;left:0;right:0;bottom:44px;z-index:70;text-align:center}
#sub span.box{display:inline-block;max-width:1500px;font:700 50px/1.25 'BV';color:#fff;background:rgba(10,12,20,.72);padding:10px 30px 14px;border-radius:14px}
#sub i{font-style:normal;transition:none}
#sub i.on{color:var(--yel)}
#sub i.done{color:#fff}
.h-serif{font-family:'NS';font-weight:700}
.mk{background-image:linear-gradient(transparent 52%,rgba(242,183,5,.85) 52%,rgba(242,183,5,.85) 92%,transparent 92%);background-repeat:no-repeat;background-size:0% 100%;padding:0 6px}
.mk2{background-image:linear-gradient(rgba(242,183,5,.9),rgba(242,183,5,.9));background-repeat:no-repeat;background-size:0% 100%;padding:0 10px}
.card{background:#fffdf6;box-shadow:0 10px 30px rgba(60,40,0,.18);border-radius:10px}
.tape{position:absolute;width:150px;height:38px;background:rgba(242,183,5,.55);top:-18px;left:50%;margin-left:-75px;transform:rotate(-3deg)}
.chip{display:inline-block;background:var(--navy);color:#fff;font:800 26px 'MS';letter-spacing:.08em;padding:10px 18px;border-radius:6px}
.lbl{font:800 24px 'MS';letter-spacing:.12em}
.abs{position:absolute}
.ph{font-family:'PH'}
.an{font-family:'AN'}
.letterbox{position:absolute;left:0;right:0;height:70px;background:#000;z-index:5}
.stamp{position:absolute;font:900 64px 'AN';color:var(--red);border:7px solid var(--red);padding:2px 26px;border-radius:12px;letter-spacing:.06em;transform:rotate(-10deg)}
